name: Checks

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  check:
    name: Types and theme
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Every text/surface pair in both themes, against WCAG AA. Known
      # exceptions are listed in theme/verify-contrast.mjs with their reason;
      # anything else fails the build.
      - name: Contrast
        run: npm run theme:contrast

      # No raw hex and no fixed light-mode palette names in app/ or
      # components/. Without this the token system decays the first time
      # someone writes bg-[#1a1c1d] or text-secondary again.
      - name: Theme tokens
        run: npm run theme:lint

      # global.css and theme/colors.generated.js are derived from
      # theme/tokens.ts and committed. If regenerating changes them, the
      # committed copies are stale and the two themes have drifted apart.
      - name: Generated CSS is current
        run: |
          npm run theme:css
          if ! git diff --quiet -- global.css theme/colors.generated.js; then
            echo "::error::global.css / colors.generated.js are out of date."
            echo "Run 'npm run theme:css' and commit the result."
            git diff --stat -- global.css theme/colors.generated.js
            exit 1
          fi
